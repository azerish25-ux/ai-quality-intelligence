name: Loose Thread optional provider boundary
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loose-thread-provider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider-fixture:
    name: Isolated provider fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Actual isolated API, PostgreSQL and fixture-only provider worker
        run: bash scripts/compose_provider_smoke.sh --confirm-disposable-stack /tmp/loose-thread-provider-report
      - name: Preserve actual provider fixture evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-fixture-${{ github.sha }}
          path: /tmp/loose-thread-provider-report
          if-no-files-found: error
          retention-days: 14
