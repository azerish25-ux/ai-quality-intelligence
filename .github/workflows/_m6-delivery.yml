name: M6 checksum-bound source delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/_m6-delivery.yml]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'azerish25-ux/ai-quality-intelligence' && github.actor == 'azerish25-ux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify reviewed patch and publish only non-workflow source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1657eed1ca06e5aa5a0e6f8aeed85b3c590b3994
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          chunks = []
          for sha in ['e00e4be6b44a5c49a8f549d69204337ca8fd54a8', '94bc9af7ec9c86053ac68beed8e81bbb8d7cdd4c', '43dd4bf2dcc842c503d74ac98caf0540bf8a88c7']:
              request = urllib.request.Request('https://api.github.com/repos/azerish25-ux/ai-quality-intelligence/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              data = base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == 'd8177a03be6eb5e4fc4630fb2d3bff776d73f70d16ef21c1eb46ab14baf2477f'
          patch = lzma.decompress(packed)
          assert len(patch) == 105428 and hashlib.sha256(patch).hexdigest() == '1ea4d5c863c0b4aa4d43864f7ac7cc61171c4a2f15b1f199ae773d19ba67e0bd'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-m6.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--exclude=.github/*', '--index', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--exclude=.github/*', '--index', '--whitespace=error', str(target)], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--binary'])
          assert hashlib.sha256(staged).hexdigest() == 'ca276c8d8d7d57db3c20c494c5ee54e7fe1c722722eef64aca9e24cac822ae8c'
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(names) == 22 and not any(p.startswith('.github/') for p in names)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Applied exactly 22 checksum-bound source files. Owner connector delivers workflow changes separately.')
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(m6.1): execute LedgerGuard faults through the evidence pipeline'
          git push origin HEAD:main
          mkdir -p /tmp/m6-delivered
          git bundle create /tmp/m6-delivered/failurelens.bundle HEAD
          git rev-parse HEAD > /tmp/m6-delivered/commit.txt
          git rev-parse HEAD^{tree} > /tmp/m6-delivered/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m6-delivered-source-${{ github.sha }}
          path: /tmp/m6-delivered
          if-no-files-found: error
          retention-days: 1
