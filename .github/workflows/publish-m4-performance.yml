name: FailureLens M4 Performance Publisher

on:
  push:
    branches:
      - main
    paths:
      - '.delivery/m4-performance-patch-*'
      - '.github/workflows/publish-m4-performance.yml'

permissions:
  contents: write

concurrency:
  group: failurelens-m4-performance-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'azerish25-ux/ai-quality-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .delivery/m4-performance-patch-* | base64 --decode > /tmp/failurelens-m4-performance.patch.gz
          echo "69ca0dbddfbdf0bafd325d9f9d539ea99aa51aca8233fe21f2a69e482fc347a2  /tmp/failurelens-m4-performance.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/failurelens-m4-performance.patch.gz > /tmp/failurelens-m4-performance.patch
          git apply --check /tmp/failurelens-m4-performance.patch
          git apply /tmp/failurelens-m4-performance.patch
      - name: Verify final tree and publish non-workflow source
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          rm -f .github/workflows/publish-m4-performance.yml
          rm -rf .delivery
          git add -A
          test "$(git write-tree)" = "2014ffad70ee1a571a815eb255befb71327615bd"
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml .github/workflows/publish-m4-performance.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(m4): deliver compatible performance intelligence" -m "Persist normalized evidence-linked performance observations, build immutable prior-only compatible baseline snapshots, expose deterministic regression findings through API, CLI, and dashboard workflows, and add migrations, browser coverage, controlled evaluation, tests, and documentation."
          git push origin HEAD:main
