name: M5.3.1 exact source verification and publication
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m531-stabilize.yml
      - scripts/m531-source-update.b64
permissions:
  contents: read
concurrency:
  group: failurelens-m531-source
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'azerish25-ux/ai-quality-intelligence' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Apply checksum-verified exact source edits
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          allowed = {
              'backend/src/failurelens/api.py', 'backend/src/failurelens/schemas.py',
              'backend/tests/test_api.py', 'frontend/src/App.tsx', 'frontend/src/api.ts',
              'frontend/src/operations.test.ts', 'frontend/e2e/durable-ingestion.spec.ts',
              'frontend/e2e/narrow-layout.spec.ts', 'frontend/e2e/operations.spec.ts',
              'frontend/e2e/navigation-regressions.spec.ts',
          }
          raw = gzip.decompress(base64.b64decode(Path('scripts/m531-source-update.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'd26d24297cc749add86f68eb74be6b096f1647484792402f0645849f1ed7a180', 'Update manifest digest mismatch'
          entries = json.loads(raw)
          assert len(entries) == len(allowed) and {entry['path'] for entry in entries} == allowed
          changes = []
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_symlink()
              if entry['before_sha256'] is None:
                  assert not path.exists(), f'Unexpected existing file: {path}'
                  before = b''
              else:
                  before = path.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == entry['before_sha256'], f'Source changed: {path}'
              lines = before.decode('utf-8').splitlines(keepends=True)
              last = len(lines)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= last
                  lines[start:end] = [replacement]
                  last = start
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after_sha256'], f'Result mismatch: {path}'
              changes.append((path, after))
          for path, after in changes:
              path.write_bytes(after)
              print(f'Applied verified source: {path}')
          PY
          git diff --check
      - name: Locked frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Backend contract and operational regression tests
        run: |
          python -m pip install './backend[dev]'
          cd backend
          pytest tests/test_api.py tests/test_auth.py tests/test_operations.py -q
      - name: Publish only the verified source changes without force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$EXPECTED_HEAD" || { echo 'main changed; refusing to overwrite concurrent work'; exit 1; }
          git add -- backend/src/failurelens/api.py backend/src/failurelens/schemas.py backend/tests/test_api.py frontend/src/App.tsx frontend/src/api.ts frontend/src/operations.test.ts frontend/e2e/durable-ingestion.spec.ts frontend/e2e/narrow-layout.spec.ts frontend/e2e/operations.spec.ts frontend/e2e/navigation-regressions.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(m5.3.1): stabilize investigation navigation and run-detail contract'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          git rev-parse HEAD
