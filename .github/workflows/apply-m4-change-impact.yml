name: Apply verified M4 change-impact delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: failurelens-m4-delivery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .delivery/m4-patch-* | base64 --decode > /tmp/failurelens-m4.patch.gz
          echo "9939448945cea72adef1c42ddbb892d21c4cd4dcd12261d0ebb82a5cc9fd91bf  /tmp/failurelens-m4.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/failurelens-m4.patch.gz > /tmp/failurelens-m4.patch
          git apply --check /tmp/failurelens-m4.patch
          git apply /tmp/failurelens-m4.patch
      - name: Publish exact verified source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .delivery
          rm .github/workflows/apply-m4-change-impact.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(git write-tree)" = "cdb5401f1371dc2f21fa1dd80b1306e668389bca"
          git commit -m "feat(m4): deliver explainable change-impact selection" -m "Add versioned mapping snapshots, deterministic bounded impact selection, conservative full-suite fallbacks, mandatory critical-test preservation, audited overrides, typed APIs, dashboard workflows, controlled evaluation, migrations, tests, and documentation."
          git push origin HEAD:main
