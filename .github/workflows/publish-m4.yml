name: Publish verified M4 infrastructure correlation

on:
  push:
    branches: [main]
    paths:
      - '.delivery/m4-patch.part-*'
      - '.github/workflows/publish-m4.yml'

permissions:
  contents: write

concurrency:
  group: publish-m4-infrastructure-correlation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 4
      - name: Verify staged delivery ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fe2dd56acb991823c5775b5605329eabb6220bb3"
          test "$(git rev-parse HEAD^^)" = "eb0e32f81a5b520824ac6f901f3c281bda4a50e7"
          test "$(git rev-parse HEAD^^^)" = "76138480b81b4a6611d12043f36297d8bd5c0c8b"
      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .delivery/m4-patch.part-00 .delivery/m4-patch.part-01
            head -c 18000 .delivery/m4-patch.part-02
            cat .delivery/m4-patch.part-03
          } | base64 --decode | gzip --decompress > /tmp/failurelens-m4.patch
          echo "811880ce8f42b4357150dfccd3e8c6d259fa21442ca4e013e7ef3db0e0d44136  /tmp/failurelens-m4.patch" | sha256sum --check --strict
          git apply --check /tmp/failurelens-m4.patch
      - name: Apply verified source and publish
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/failurelens-m4.patch
          rm -rf .delivery
          rm -f .github/workflows/publish-m4.yml
          python -m compileall -q backend/src backend/tests evaluation
          bash -n scripts/verify.sh integrations/github-action/run.sh
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(m4): correlate trusted infrastructure events" -m "Persist independently recorded infrastructure events, calculate deterministic prior-only exposed versus unexposed cohorts, preserve trust and context boundaries, expose immutable API/CLI/dashboard workflows, and add adversarial evaluation, migrations, tests, and documentation."
          git push origin HEAD:main
