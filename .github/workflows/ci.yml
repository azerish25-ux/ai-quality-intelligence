name: FailureLens CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failurelens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  producer-fixtures:
    name: Producer fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAILURELENS_DATABASE_URL: "sqlite+pysqlite:///:memory:"
      FAILURELENS_DEMO_MODE: "true"
      FAILURELENS_PRODUCER_FIXTURES: /tmp/failurelens-producer-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned producer tools and application
        run: |
          python -m pip install './backend[dev]' pytest==9.0.2 pytest-json-report==1.5.0
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Execute actual producers and independently verify expected faults
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python integrations/producer-fixtures/run.py --output "$FAILURELENS_PRODUCER_FIXTURES"
      - name: Verify actual exports through parsers and durable API
        run: python -m pytest backend/tests/test_producer_contracts.py
      - name: Preserve executed producer provenance and fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: producer-fixtures-${{ github.sha }}
          path: /tmp/failurelens-producer-fixtures
          if-no-files-found: error
          retention-days: 30
          # This dedicated output contains only our controlled producer fixtures.
          include-hidden-files: true

  backend:
    name: Backend
    needs: producer-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: failurelens_test
          POSTGRES_USER: failurelens
          POSTGRES_PASSWORD: failurelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U failurelens -d failurelens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FAILURELENS_DATABASE_URL: postgresql+psycopg://failurelens:failurelens@127.0.0.1:5432/failurelens_test
      FAILURELENS_PRODUCER_FIXTURES: /tmp/failurelens-producer-fixtures
      FAILURELENS_ARTIFACT_ROOT: /tmp/failurelens-artifacts
      FAILURELENS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install committed backend without modifying measured source
        run: bash scripts/install_committed_backend.sh
      - name: Download exact-revision executed producer fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: producer-fixtures-${{ github.sha }}
          path: /tmp/failurelens-producer-fixtures
      - name: Migrate PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Test and coverage
        working-directory: backend
        run: pytest --cov=failurelens --cov-branch --cov-report=term-missing --cov-fail-under=75

  evaluation:
    name: Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install deterministic core
        run: python -m pip install ./backend
      - name: Regenerate corpus and evaluate frozen test split
        run: |
          python evaluation/generate_corpus.py
          python evaluation/generate_clustering_corpus.py
          python evaluation/generate_impact_corpus.py
          python evaluation/generate_performance_corpus.py
          python evaluation/generate_infrastructure_corpus.py
          PYTHONPATH=backend/src python evaluation/harness.py --split test --output evaluation/reports/ci
          PYTHONPATH=backend/src python evaluation/clustering_harness.py --output evaluation/reports/ci
          PYTHONPATH=backend/src python evaluation/impact_harness.py --output evaluation/reports/ci
          PYTHONPATH=backend/src python evaluation/performance_harness.py --output evaluation/reports/ci
          PYTHONPATH=backend/src python evaluation/infrastructure_harness.py --output evaluation/reports/ci

  ledgerguard-evaluation:
    name: LedgerGuard execution and evidence integrity (quality targets reported separately)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: failurelens_evaluation
          POSTGRES_USER: failurelens
          POSTGRES_PASSWORD: failurelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U failurelens -d failurelens_evaluation"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FAILURELENS_DATABASE_URL: postgresql+psycopg://failurelens:failurelens@127.0.0.1:5432/failurelens_evaluation
      FAILURELENS_ARTIFACT_ROOT: /tmp/failurelens-m6-private
      FAILURELENS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: azerish25-ux/transaction-reliability-lab
          ref: 13bdd62c924a3230825b6d9304f449f887c8e7fe
          path: .ledgerguard-evaluation-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install the locked-compatible application
        run: python -m pip install './backend[dev]'
      - name: Migrate disposable PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Execute pinned production components and independent oracles
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python integrations/ledgerguard/run.py --ledgerguard-source .ledgerguard-evaluation-source --output /tmp/failurelens-m6/corpus
      - name: Replay public artifacts through API and durable worker without labels
        run: python evaluation/replay.py --inputs /tmp/failurelens-m6/corpus/inputs --output /tmp/failurelens-m6/replay --repeats 5 --confirm-disposable-database
      - name: Score immutable predictions and enforce integrity and safety
        run: python evaluation/executed_harness.py --corpus /tmp/failurelens-m6/corpus --replay /tmp/failurelens-m6/replay --output /tmp/failurelens-m6/report
      - name: Audit legacy family independence without rewriting historical scores
        run: |
          python evaluation/generate_corpus.py
          python evaluation/corpus_audit.py --output /tmp/failurelens-m6/legacy-audit.json
      - name: Publish measured targets including failures
        if: always()
        run: |
          if test -f /tmp/failurelens-m6/report/report.md; then
            cat /tmp/failurelens-m6/report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'M6 execution did not produce a complete report; inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve exact-revision executed corpus and inspectable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgerguard-evaluation-${{ github.sha }}
          path: /tmp/failurelens-m6
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test upload client
        working-directory: frontend
        run: npm test
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  browser-e2e:
    needs: [producer-fixtures, ledgerguard-evaluation]
    name: browser-e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: chromium-narrow
            browser: chromium
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: failurelens_browser
          POSTGRES_USER: failurelens
          POSTGRES_PASSWORD: failurelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U failurelens -d failurelens_browser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FAILURELENS_DATABASE_URL: postgresql+psycopg://failurelens:failurelens@127.0.0.1:5432/failurelens_browser
      FAILURELENS_PRODUCER_FIXTURES: /tmp/failurelens-producer-fixtures
      FAILURELENS_ARTIFACT_ROOT: /tmp/failurelens-browser-artifacts
      FAILURELENS_EVALUATION_METRICS_PATH: /tmp/failurelens-m6-browser/report/metrics.json
      FAILURELENS_OPERATIONS_FIXTURES: /tmp/failurelens-operations-fixtures.json
      FAILURELENS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install application and browser dependencies
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install './backend[dev]'
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps "$BROWSER"
      - name: Download exact-revision executed producer fixtures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: producer-fixtures-${{ github.sha }}
          path: /tmp/failurelens-producer-fixtures
      - name: Migrate PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Load this revision's real evaluation results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledgerguard-evaluation-${{ github.sha }}
          path: /tmp/failurelens-m6-browser
      - name: Seed disposable operational browser fixtures
        run: python scripts/seed_operations_browser.py --confirm-disposable-database --output "$FAILURELENS_OPERATIONS_FIXTURES"
      - name: Start API, durable worker, and dashboard
        run: |
          set -euo pipefail
          nohup uvicorn failurelens.api:app --host 127.0.0.1 --port 8000 > /tmp/failurelens-api.log 2>&1 &
          nohup failurelens-worker --poll-seconds 0.2 > /tmp/failurelens-worker.log 2>&1 &
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/failurelens-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/failurelens-api.log /tmp/failurelens-worker.log /tmp/failurelens-vite.log
          exit 1
      - name: Cross-browser accessibility and API-backed journeys
        working-directory: frontend
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: npm run test:e2e -- --project="$PLAYWRIGHT_PROJECT"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failurelens-browser-diagnostics-${{ matrix.project }}
          path: |
            /tmp/failurelens-api.log
            /tmp/failurelens-worker.log
            /tmp/failurelens-vite.log
            /tmp/failurelens-operations-fixtures.json
            frontend/test-results
          if-no-files-found: warn
          retention-days: 7

  docker-config:
    name: Docker config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api dashboard
      - name: Verify offline runtime, persistence and synthetic backup restore
        run: bash scripts/compose_recovery_smoke.sh --confirm-disposable-stack
