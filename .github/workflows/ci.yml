name: FailureLens CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failurelens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: failurelens_test
          POSTGRES_USER: failurelens
          POSTGRES_PASSWORD: failurelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U failurelens -d failurelens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FAILURELENS_DATABASE_URL: postgresql+psycopg://failurelens:failurelens@127.0.0.1:5432/failurelens_test
      FAILURELENS_ARTIFACT_ROOT: /tmp/failurelens-artifacts
      FAILURELENS_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install './backend[dev]'
      - name: Migrate PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Test and coverage
        working-directory: backend
        run: pytest --cov=failurelens --cov-branch --cov-report=term-missing --cov-fail-under=75

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install deterministic core
        run: python -m pip install ./backend
      - name: Regenerate corpus and evaluate frozen test split
        run: |
          python evaluation/generate_corpus.py
          PYTHONPATH=backend/src python evaluation/harness.py --split test --output evaluation/reports/ci

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api dashboard
