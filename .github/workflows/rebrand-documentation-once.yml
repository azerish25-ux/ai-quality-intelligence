name: Prepare owner-requested Loose Thread documentation rename
on:
  push:
    branches: [main]
    paths: [.github/workflows/rebrand-documentation-once.yml]
permissions:
  contents: read
jobs:
  prepare-documentation-tree:
    if: github.repository_id == '1389256261' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the exact prose-only change and create its Git tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.request

          BASE = '2de918e5709d12afba2e415edd3c020fac83ed7c'
          EXPECTED_TREE = 'd1b1920ca167a71e0d83d3161dd69bba95ad5259'
          REPO = 'https://github.com/azerish25-ux/ai-quality-intelligence'
          WORKFLOW = '.github/workflows/rebrand-documentation-once.yml'
          NAME = re.compile(r'(?<![\w-])FailureLens(?![\w-])')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == BASE, 'Source moved; do not overwrite concurrent work'
          assert not git('status', '--porcelain')
          base_tree = git('rev-parse', 'HEAD^{tree}')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = []
          elements = []
          protected = {}
          for name in paths:
              if not name:
                  continue
              path = Path(name)
              if name.startswith(('evaluation/corpus/', 'evaluation/manifests/', 'evaluation/policies/')) or (
                  name.startswith('evaluation/reports/') and path.name.lower() != 'readme.md'
              ):
                  protected[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  continue
              if path.suffix.lower() not in {'.md', '.mdx', '.rst', '.adoc'}:
                  continue
              before = path.read_text()
              after = NAME.sub('Loose Thread', before)
              for archive in ('PROGRESS-through-M5.3.md', 'PROGRESS-through-M6.1.md', 'PROGRESS-through-M6.4.1.md'):
                  after = after.replace('](' + archive + ')', '](' + REPO + '/blob/' + BASE + '/docs/' + archive + ')')
              if name.startswith('docs/PROGRESS-through-') and after != before:
                  after = ('> **Branding note:** Product-name prose now uses **Loose Thread**. '
                           'Recorded measurements, outcomes and technical identifiers are unchanged. '
                           '[Original historical text](' + REPO + '/blob/' + BASE + '/' + name + ').\n\n') + after
              if name == 'README.md':
                  after += ('\n## Name and compatibility\n\n'
                            '**Loose Thread** is the product name used throughout the maintained documentation. '
                            'This is a branding change, not a breaking interface migration.\n\n'
                            'Existing commands (`failurelens`, `failurelens-worker`), Python package/import paths, '
                            '`FAILURELENS_*` settings, `X-FailureLens-Token`, media types, schema identifiers and '
                            'storage names remain unchanged so the documented commands and existing installations '
                            'continue to work. Checksummed execution archives and original measured reports retain '
                            'their exact bytes and may display the previous branding; their historical results '
                            'have not been rewritten.\n')
              if after != before:
                  assert re.findall(r'^```[^\n]*\n.*?^```', before, re.M | re.S) == re.findall(r'^```[^\n]*\n.*?^```', after, re.M | re.S), name
                  path.write_text(after)
                  changed.append(name)
                  elements.append(dict(path=name, mode='100644', type='blob', content=after))
          assert len(changed) == 22
          for name, sha in protected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name
          for name in paths:
              if not name or name in protected:
                  continue
              path = Path(name)
              if path.suffix.lower() in {'.md', '.mdx', '.rst', '.adoc'}:
                  assert not NAME.search(path.read_text()), name
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *changed], check=True)
          subprocess.run(['git', 'rm', '--', WORKFLOW], check=True)
          assert git('write-tree') == EXPECTED_TREE, 'Unexpected output tree'
          elements.append(dict(path=WORKFLOW, mode='100644', type='blob', sha=None))
          payload = json.dumps(dict(base_tree=base_tree, tree=elements)).encode()
          endpoint = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/trees'
          request = urllib.request.Request(endpoint, data=payload, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=60) as response:
              created = json.load(response)
          assert created['sha'] == EXPECTED_TREE
          print(json.dumps(dict(tree_sha=created['sha'], documentation_files=len(changed),
                                preserved_evidence_files=len(protected), branch_updated=False)))
          # No branch mutation: the connected repository writer will verify this
          # tree and publish the owner's documentation commit without force.
          PY
