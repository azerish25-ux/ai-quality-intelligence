name: M2 checksum-bound source delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/_m2-delivery.yml]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'azerish25-ux/ai-quality-intelligence' && github.actor == 'azerish25-ux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.13'
      - name: Verify exact parent and apply immutable source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = f84da131e4b5c2f498a2d7cf7a15fa1f324c41b2
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          parts = ['8ba504d7a1c1eb8a2c496b77cef82aa1b6703669', '123348dac82a2ee9958d00c445b0df8206400ae4', '985fe25e59fded7e01407fb0b48d9411da54092e', '4a69ee74b9a41faf305967e6e211c188f34b6a3c']
          chunks = []
          for sha in parts:
              request = urllib.request.Request('https://api.github.com/repos/azerish25-ux/ai-quality-intelligence/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              data = base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              chunks.append(data)
          patch = lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest() == '5e809d10c3202a410ef08a5c88149167acf67f3f02898a09dc3771d69128290d'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm2-reviewed-source.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(target)], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed and not any(path.startswith('.github/') for path in changed)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Verified and applied', len(changed), 'source files; workflow changes are delivered separately by the owner connection.')
          PY
      - name: Verify delivered source subset
        run: |
          python -m pip install -e './backend[dev]'
          python -m compileall -q backend/src backend/tests integrations/producer-fixtures
          python -m pytest backend/tests/test_ingestion_m2_adapters.py backend/tests/test_binary_evidence.py -q --no-cov
      - name: Commit and fast-forward main
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name azerish25-ux
          git config user.email azerish25@gmail.com
          git commit -m 'feat(m2.1): implement reviewed binary evidence and real producer acceptance'
          git push origin HEAD:main
          git rev-parse HEAD
