name: Apply durable ingestion verification fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-durable-ingestion-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Apply targeted repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "backend/src/failurelens/models.py",
              '    ingestion: Mapped[Ingestion | None] = relationship(back_populates="run", uselist=False)\n',
              '    ingestion: Mapped[Ingestion | None] = relationship(\n'
              '        back_populates="run",\n'
              '        uselist=False,\n'
              '        foreign_keys="Ingestion.run_id",\n'
              '    )\n',
          )
          replace(
              "backend/src/failurelens/models.py",
              '    run: Mapped[Run | None] = relationship(back_populates="ingestion")\n',
              '    run: Mapped[Run | None] = relationship(\n'
              '        back_populates="ingestion",\n'
              '        foreign_keys=[run_id],\n'
              '    )\n',
          )
          replace(
              "backend/pyproject.toml",
              'omit = ["src/failurelens/cli.py", "src/failurelens/jobs.py"]',
              'omit = ["*/failurelens/cli.py", "*/failurelens/jobs.py"]',
          )
          Path("backend/tests/test_models.py").write_text(
              'from sqlalchemy.orm import configure_mappers\n\n\n'
              'def test_relationship_mappers_are_unambiguous() -> None:\n'
              '    """The live API must be able to configure all ORM joins before first use."""\n'
              '    configure_mappers()\n',
              encoding="utf-8",
          )

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text(encoding="utf-8")
          ci = ci.replace("npm install --no-audit --no-fund", "npm ci --no-audit --no-fund")
          ci, count = re.subn(
              r'      - name: Upload generated npm lockfile\n'
              r'        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4\n'
              r'        with:\n'
              r'          name: frontend-package-lock\n'
              r'          path: frontend/package-lock.json\n'
              r'          if-no-files-found: error\n'
              r'          retention-days: 1\n',
              "",
              ci,
          )
          if count != 1:
              raise SystemExit(f"expected one generated-lockfile upload step, found {count}")
          ci_path.write_text(ci, encoding="utf-8")

          Path("frontend/Dockerfile").write_text(
              """FROM node:22-alpine AS build
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci --no-audit --no-fund
          COPY . .
          RUN npm run build

          FROM nginx:1.27-alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY --from=build /app/dist /usr/share/nginx/html
          EXPOSE 8080
          """,
              encoding="utf-8",
          )

          replace("docs/PROGRESS.md", "27 passed.", "28 passed.")
          replace(
              "docs/PROGRESS.md",
              "PostgreSQL migration/integration, npm test/build, Chromium E2E, evaluation, and Docker checks are delegated to the committed GitHub workflow and must be evaluated against the exact delivered SHA.",
              "PostgreSQL migration/integration, locked npm test/build, Chromium E2E, evaluation, and Docker checks are evaluated by the committed GitHub workflow against each delivered SHA.",
          )
          replace(
              "README.md",
              "4. Commit an npm lockfile after dependency resolution in an environment with registry access; CI currently preserves the generated lockfile as an artifact.\n"
              "5. Continue M3+ work: explainable cluster persistence/revisions, history rates, impact selection, performance baselines, complete review roles/views, actual LedgerGuard corpus, and live idempotent GitHub publication.",
              "4. Continue M3+ work: explainable cluster persistence/revisions, history rates, impact selection, performance baselines, complete review roles/views, actual LedgerGuard corpus, and live idempotent GitHub publication.",
          )
          PY

          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test
          npm run build
          cd ..

          python -m pip install './backend[dev]'
          cd backend
          pytest --cov=failurelens --cov-branch --cov-report=term-missing --cov-fail-under=75
          python -m compileall -q src tests
          cd ..

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FailureLens delivery bot"
          git config user.email "azerish25-ux@users.noreply.github.com"
          git add \
            backend/src/failurelens/models.py \
            backend/pyproject.toml \
            backend/tests/test_models.py \
            docs/PROGRESS.md \
            frontend/package-lock.json \
            frontend/Dockerfile \
            README.md
          git diff --cached --check
          git commit -m "fix: stabilize durable ingestion verification"
          git push origin HEAD:main
