name: M6.3 Exact Source Publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m63-publish.yml']
permissions:
  contents: write
jobs:
  verified-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0ca3003472917af004fe62870221b67527cf4e71
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install corpus validation dependency
        run: python -m pip install 'pydantic>=2.7,<3'
      - name: Reconstruct and publish only the verified Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '0ca3003472917af004fe62870221b67527cf4e71'
          expected_tree = 'b26ed8ca09503795deac8293c9a1d8c9f21fae7d'
          chunks = ['fc4280e7031a28c17f57caad0357ce0bfceee0a8', '1f3dcfe2e89d419978e952d6b0022e83f4a3024d', '40f14d7c3bc112d8b42cd2d71bdb68b0c552b030', '60ed916c126652871c685309823a477c121d3f8c', 'e7c956a66aae6b0997d2c355106e624116caf82d']
          root = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          def api(path, payload=None):
              req = urllib.request.Request(root+path, data=None if payload is None else json.dumps(payload).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          data = b''
          for sha in chunks:
              blob = api('/git/blobs/'+sha)
              part = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              data += part
          assert hashlib.sha256(data).hexdigest()=='0bc93bc90fdf42662630641228fcd4afe5cd523670e1fc555255e5b269d9daa8'
          patch = pathlib.Path('/tmp/m63-source.patch')
          patch.write_bytes(lzma.decompress(data))
          assert patch.stat().st_size==195712
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          subprocess.run(['python','evaluation/generate_campaign.py','--output','/tmp/m63-source-corpus','--pack','evaluation/corpus/diverse-v1/corpus.json.xz'],check=True)
          archive = pathlib.Path('evaluation/corpus/diverse-v1/corpus.json.xz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='e7249efc7e5ac3b2470444b7cfafcbe1582c7172eee5c50c61c42aa5d12014f8'
          subprocess.run(['git','add',str(archive)],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==expected_tree, (tree,expected_tree)
          paths = subprocess.check_output(['git','diff','--cached','--name-only',base],text=True).splitlines()
          entries=[]
          for path in paths:
              content=pathlib.Path(path).read_bytes()
              sha=api('/git/blobs', {'content':base64.b64encode(content).decode(),'encoding':'base64'})['sha']
              assert sha==subprocess.check_output(['git','hash-object',path],text=True).strip()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          result=api('/git/trees', {'base_tree':'fec102f38489e47c9b4692d7bfee737823de9070','tree':entries})
          assert result['sha']==expected_tree
          print('VERIFIED_REMOTE_TREE='+result['sha'])
          print('SOURCE_FILES='+str(len(paths)))
          print('No branch update was attempted. The authorized connected account publishes this exact tree.')
          PY
