name: FailureLens M4 Delivery
on:
  push:
    branches: [delivery/m4-impact]
permissions:
  contents: write
  actions: write
concurrency:
  group: failurelens-m4-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: failurelens_delivery
          POSTGRES_USER: failurelens
          POSTGRES_PASSWORD: failurelens
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U failurelens -d failurelens_delivery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BASE_SHA: 48335b42c2da5b74bee0ce02aea471b987e5d416
      PATCH_SHA256: ee47796b6ab5c7978f7a98e29be84441b4fb45feaa8318c869731b5488505b5c
      FAILURELENS_DATABASE_URL: postgresql+psycopg://failurelens:failurelens@127.0.0.1:5432/failurelens_delivery
      FAILURELENS_ARTIFACT_ROOT: /tmp/failurelens-delivery-artifacts
      FAILURELENS_DEMO_MODE: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Reconstruct exact commit
        run: .delivery/prepare.sh
      - name: Install backend
        run: python -m pip install './backend[dev]'
      - name: Verify backend, migrations, evaluation, and safety
        run: PYTHON=python ./scripts/verify.sh
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Verify browser journey
        run: /tmp/browser.sh
      - name: Verify Docker packaging
        run: |
          docker compose config --quiet
          docker compose build api dashboard
      - name: Publish exact commit
        run: /tmp/publish.sh
