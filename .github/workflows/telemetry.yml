name: Loose Thread Local Telemetry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loose-thread-telemetry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Actual isolated collector, durable trace and viewer
        run: bash scripts/compose_telemetry_smoke.sh --confirm-disposable-stack /tmp/loose-thread-telemetry-report
      - name: Preserve actual telemetry evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-telemetry-${{ github.sha }}
          path: /tmp/loose-thread-telemetry-report
          if-no-files-found: error
          retention-days: 14
