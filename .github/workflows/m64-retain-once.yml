name: Retain verified M6.4 development evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/m64-retain-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostic-development-dc0aaf1202bffc7557f1a04b0aa5afdfdc8ce5fb
          run-id: '36519135228'
          github-token: ${{ github.token }}
          path: /tmp/m64-retained-input
      - name: Preserve byte-exact measured files and verify the expected archive digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, json, lzma, shutil, subprocess, zipfile
          source = 'dc0aaf1202bffc7557f1a04b0aa5afdfdc8ce5fb'
          allowed = {'evaluation/verify_diagnostic_snapshot.py', 'backend/tests/test_diagnostic_snapshot.py', 'evaluation/reports/diagnostic-development-v1/retention.json', 'docs/M64-DELIVERY.md', '.github/workflows/m64-retain-once.yml'}
          changed = set(subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines())
          assert changed == allowed, changed
          root = Path('/tmp/m64-retained-input')
          paths = sorted(p for p in root.rglob('*') if p.is_file())
          assert len(paths) == 150 and sum(p.stat().st_size for p in paths) < 4*1024*1024
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer,'w',compression=zipfile.ZIP_STORED) as output:
              for path in paths:
                  assert not path.is_symlink() and path.stat().st_size < 1024*1024
                  item = zipfile.ZipInfo(path.relative_to(root).as_posix(), (2026,1,1,0,0,0))
                  item.external_attr = 0o100644 << 16
                  output.writestr(item,path.read_bytes())
          data = buffer.getvalue()
          target = Path('evaluation/reports/diagnostic-development-v1')
          meta = json.loads((target/'retention.json').read_bytes())
          assert meta['tested_source_revision'] == source
          assert hashlib.sha256(data).hexdigest() == meta['snapshot']['zip_sha256']
          compressed = lzma.compress(data,preset=6)
          assert hashlib.sha256(compressed).hexdigest() == meta['snapshot']['sha256']
          with (target/'execution.zip.xz').open('xb') as stream: stream.write(compressed)
          for name, expected in meta['report_sha256'].items():
              assert name in {'metrics.json','report.md','predictions.jsonl'}
              value = (root/'report'/name).read_bytes()
              assert hashlib.sha256(value).hexdigest() == expected
              with (target/name).open('xb') as stream: stream.write(value)
          p=Path('README.md'); value=p.read_text(); marker='[Contracts, execution scope and reproduction](docs/diagnostic-quality.md).'
          assert value.count(marker)==1
          p.write_text(value.replace(marker, marker+' [Executed M6.4 evidence and limitations](docs/M64-DELIVERY.md).'))
          p=Path('docs/PROGRESS.md'); value=p.read_text(); marker='# FailureLens delivery ledger\n'
          assert value.startswith(marker)
          p.write_text(value.replace(marker, marker+'\n## M6.4 executed development checkpoint\n\nThe measured source `dc0aaf1202bffc7557f1a04b0aa5afdfdc8ce5fb` passed fresh component execution, PostgreSQL replay, independent scoring, build and all sixteen diagnostic browser journeys in run `36519135228`. All 32 development cases were classified correctly; this is not held-out quality recovery. The exact report, retained failures, snapshot verification and remaining work are in [M64-DELIVERY.md](M64-DELIVERY.md). Historical checkpoints below retain their original scope. Subsequent source revisions require their own CI.\n',1))
          p=Path('docs/requirements-matrix.md'); lines=p.read_text().splitlines()
          changes={
            'R-M64-OBSERVE':'| R-M64-OBSERVE | Fresh richer companion observations | PASS | Run `36519135228` at `dc0aaf1`: twelve fresh interventions and twelve controls across three known mechanisms; independent scalar oracles. Not new held-out families or HTTP/database transactions. |',
            'R-M64-UI':'| R-M64-UI | Display diagnostic findings and unresolved gaps | PASS | Same exact-source run passed all sixteen desktop/narrow API-backed diagnostic journeys. Captured views inspected; no retries or assertions weakened. |'}
          for key, replacement in changes.items():
              found=[i for i,l in enumerate(lines) if l.startswith('| '+key+' |')]; assert len(found)==1
              lines[found[0]]=replacement
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Independently rescore and test retained evidence before publication
        run: |
          python -m pip install './backend[dev]'
          python evaluation/verify_diagnostic_snapshot.py
          python -m pytest backend/tests/test_diagnostic_snapshot.py backend/tests/test_diagnostic_contracts.py backend/tests/test_diagnostic_evaluation.py backend/tests/test_contract_evidence.py -q
          git diff --check
      - name: Publish only verified reports and delivery records without force
        shell: bash
        run: |
          set -euo pipefail
          git add evaluation/reports/diagnostic-development-v1 README.md docs/PROGRESS.md docs/requirements-matrix.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(m6.4): retain exact executed evidence and independently verified development results'
          git push origin HEAD:main
          printf 'Published retained evidence at `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
