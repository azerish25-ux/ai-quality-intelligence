name: FailureLens Source Export

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf /tmp/failurelens-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: failurelens-source-${{ github.sha }}
          path: /tmp/failurelens-source.tgz
          if-no-files-found: error
          retention-days: 1
