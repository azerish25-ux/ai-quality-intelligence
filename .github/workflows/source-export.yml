name: FailureLens Source Export

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failurelens-source-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-source:
    name: Export source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed source and recoverable Git history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=tar.gz --output=/tmp/failurelens-source.tgz HEAD
          git bundle create /tmp/failurelens-source.bundle HEAD
          git bundle verify /tmp/failurelens-source.bundle
          printf '%s\n' "$GITHUB_SHA" > /tmp/failurelens-source-revision.txt
          (cd /tmp && sha256sum failurelens-source.tgz failurelens-source.bundle > failurelens-source-sha256.txt)
      - name: Upload exact committed source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failurelens-source-${{ github.sha }}
          path: |
            /tmp/failurelens-source.tgz
            /tmp/failurelens-source.bundle
            /tmp/failurelens-source-revision.txt
            /tmp/failurelens-source-sha256.txt
          if-no-files-found: error
          retention-days: 1
