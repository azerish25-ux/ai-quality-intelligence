name: M2 replay source delivery
on:
  push:
    branches: [main]
    paths: [.github/workflows/_m2-replay-delivery.yml]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'azerish25-ux/ai-quality-intelligence' && github.actor == 'azerish25-ux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Apply exact reviewed patch
        run: |
          test "$(git rev-parse HEAD^)" = b00978693e310380ba6dff1e5ebd4689abb362d6
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '273597b1a4e8323759866f5e705b81e5ce3abda177cabf3783fea382ebe45740'
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'replay.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index','--whitespace=error',str(path)],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()) == {'backend/src/failurelens/service.py','backend/tests/test_binary_evidence.py'}
          PY
      - name: Verify regression without weakening retention behavior
        run: |
          python -m pip install './backend[dev]'
          python -m pytest backend/tests/test_binary_evidence.py backend/tests/test_operations.py --no-cov -q
      - name: Commit and fast-forward exact main
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name azerish25-ux
          git config user.email azerish25@gmail.com
          git commit -m 'fix(ingestion): preserve idempotent replay after binary source disposal'
          git push origin HEAD:main
