name: FailureLens M5.3 source import
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-m53.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'azerish25-ux/ai-quality-intelligence' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve original commit identity for verified source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import urllib.error
          repository = 'azerish25-ux/ai-quality-intelligence'
          target = '3fa99919b6ad2127241e1b208c60ea4a7c9bc926'
          tree = 'af65750fc89cda892fa0488eadeb1dcb327fcded'
          parent = '03870bbd65695e8ed6c7249b40c8024c212666b7'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          def api(path, payload=None):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  print('GitHub error:', exc.code, exc.read().decode())
                  raise
          assert api(f'git/trees/{tree}')['sha'] == tree
          identity = {'name': 'azerish25-ux', 'email': 'azerish25@gmail.com', 'date': '2026-09-28T14:20:12Z'}
          result = api('git/commits', {
              'message': 'feat(m5.3): add retention and operational account governance\n',
              'tree': tree, 'parents': [parent], 'author': identity, 'committer': identity})
          print(json.dumps({'commit': result['sha'], 'tree': result['tree']['sha'], 'branch_updated': False}))
          assert result['sha'] == target
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Verified original commit `{target}` and source tree `{tree}`. No branch references were updated.\n')
