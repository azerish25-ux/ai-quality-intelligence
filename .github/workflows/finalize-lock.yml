name: Finalize frontend lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.head_commit.message == 'chore: prepare frontend lock finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate exact npm lockfile without dependency scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: commit verified frontend lockfile"
          git push origin HEAD:main
