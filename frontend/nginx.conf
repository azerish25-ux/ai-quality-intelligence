server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  location /api/ {
    client_max_body_size 251m;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /health/ {
    proxy_pass http://api:8000;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}

# Loopback-published API gateway. Only this proxy joins the edge network; the
# application, worker and database retain an internal-only runtime network.
server {
  listen 8000;
  server_name _;
  client_max_body_size 251m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
