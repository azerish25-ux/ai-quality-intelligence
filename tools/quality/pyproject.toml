[project]
name = "loose-thread-quality-tools"
version = "0.1.0"
description = "Isolated, pinned static-analysis and dependency-audit tools"
requires-python = ">=3.12"
dependencies = [
  "detect-secrets==1.5.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "ruff==0.16.9",
  "uv==0.12.19",
  "zizmor==1.30.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
