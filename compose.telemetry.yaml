# Explicit local-only tracing profile. Core Compose remains export-disabled.
services:
  api:
    environment:
      FAILURELENS_TELEMETRY_EXPORT_ENABLED: "true"
      FAILURELENS_TELEMETRY_ENDPOINT: http://otel-collector:4318/v1/traces
  worker:
    environment:
      FAILURELENS_TELEMETRY_EXPORT_ENABLED: "true"
      FAILURELENS_TELEMETRY_ENDPOINT: http://otel-collector:4318/v1/traces
  otel-collector:
    image: jaegertracing/jaeger:2.21.0
    profiles: [telemetry]
    command: ["--config", "/etc/jaeger/local.yaml"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./integrations/telemetry/jaeger.yaml:/etc/jaeger/local.yaml:ro
    networks: [failurelens]
  telemetry-viewer:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles: [telemetry]
    ports: ["127.0.0.1:16686:8080"]
    depends_on: [otel-collector]
    volumes:
      - ./integrations/telemetry/viewer.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [failurelens, edge]
