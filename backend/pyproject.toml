[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "failurelens"
version = "0.6.0"
description = "Evidence-grounded automated test failure triage and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
failurelens = "failurelens.cli:main"
failurelens-worker = "failurelens.jobs:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["failurelens"]

[tool.coverage.report]
show_missing = true
fail_under = 75
omit = ["*/failurelens/cli.py", "*/failurelens/jobs.py"]
