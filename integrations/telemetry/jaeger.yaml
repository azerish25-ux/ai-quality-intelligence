# Jaeger v2 is an OpenTelemetry Collector distribution. No external exporters,
# raw-debug exporter, remote sampling, browser telemetry, MCP or AI agent enabled.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 64
    send_batch_max_size: 64
exporters:
  jaeger_storage_exporter:
    trace_storage: local_memory
extensions:
  jaeger_storage:
    backends:
      local_memory:
        memory:
          max_traces: 1000
  jaeger_query:
    storage:
      traces: local_memory
    ai: null
    otlp_proxy: null
    enable_tracing: false
    max_trace_size: 1000
    http:
      endpoint: 0.0.0.0:16686
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
