# Fixed query/UI gateway; no OTLP receiver is published to the host.
map $request_method $failurelens_method {
  default OTHER;
  GET GET; HEAD HEAD;
}
log_format failurelens_viewer_safe escape=json '{"event":"viewer_request","method":"$failurelens_method","status":$status}';
access_log /dev/stdout failurelens_viewer_safe;
error_log /dev/null;

server {
  listen 8080;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-store always;
  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://otel-collector:16686;
    proxy_set_header Host $host;
  }
}
