name: FailureLens report
description: Durably ingest supported test output and produce an evidence-grounded deterministic report
branding:
  icon: search
  color: blue
inputs:
  report:
    description: Path to a JUnit XML, Playwright JSON, or FailureLens ZIP bundle
    required: true
  project:
    description: FailureLens project slug
    required: true
  external-id:
    description: Trusted workflow/run identifier
    required: true
  repository:
    description: Trusted repository identity for the analyzed comparison
    required: false
    default: ""
  base-sha:
    description: Trusted base revision for changed-file comparison
    required: false
    default: ""
  head-sha:
    description: Exact tested head revision
    required: false
    default: ""
  branch:
    description: Trusted branch name
    required: false
    default: ""
  run-scope:
    description: Whether this artifact represents a full suite or an impact-selected run
    required: false
    default: unknown
  comparison-trust:
    description: Provenance of changed-file metadata; keep self_reported for untrusted PR artifacts
    required: false
    default: self_reported
  attempt:
    description: Trusted workflow run attempt
    required: false
    default: "1"
  expected-inputs:
    description: Expected required artifacts; a manifest must still declare each expected shard
    required: false
    default: ""
  shard-count:
    description: Trusted number of planned test shards
    required: false
    default: ""
  config-path:
    description: Optional explicit path to operator-selected inert JSON configuration; never auto-discovered from PR contents
    required: false
    default: ""
  config-sha256:
    description: SHA-256 from reviewed workflow/operator configuration, required with config-path; integrity is not provenance
    required: false
    default: ""
  analysis-mode:
    description: Only deterministic is supported; empty uses config or the deterministic default
    required: false
    default: ""
  publication-mode:
    description: summary (default) or artifact-only; neither mode posts comments or activates a provider
    required: false
    default: ""
  database-url:
    description: SQLAlchemy database URL; PostgreSQL is recommended
    required: false
    default: sqlite+pysqlite:///./failurelens-action.db
outputs:
  evidence-path:
    description: Bounded canonical inert evidence.json export, empty on processing failure
    value: ${{ steps.failurelens.outputs.evidence-path }}
  report-json-path:
    description: Sanitized versioned JSON report path, empty on processing failure
    value: ${{ steps.failurelens.outputs.report-json-path }}
  status-path:
    description: Fixed-field processing status JSON path, also emitted on processing failure
    value: ${{ steps.failurelens.outputs.status-path }}
  status:
    description: reported or failed; not a release decision
    value: ${{ steps.failurelens.outputs.status }}
  ingestion-state:
    description: Durable ingestion state
    value: ${{ steps.failurelens.outputs.ingestion-state }}
  run-status:
    description: Persisted run processing state
    value: ${{ steps.failurelens.outputs.run-status }}
  completeness:
    description: complete, partial, unknown or evidence_expired
    value: ${{ steps.failurelens.outputs.completeness }}
  advisory-status:
    description: HOLD_FOR_REVIEW or NO_BLOCKER_IDENTIFIED_IN_OBSERVED_SCOPE
    value: ${{ steps.failurelens.outputs.advisory-status }}
  report-digest:
    description: SHA-256 of the canonical unsigned JSON projection
    value: ${{ steps.failurelens.outputs.report-digest }}
  report-path:
    description: Sanitized Markdown report path
    value: ${{ steps.failurelens.outputs.report-path }}
  run-id:
    description: Normalized FailureLens run identifier
    value: ${{ steps.failurelens.outputs.run-id }}
  ingestion-id:
    description: Durable FailureLens ingestion identifier
    value: ${{ steps.failurelens.outputs.ingestion-id }}
runs:
  using: composite
  steps:
    - name: Install FailureLens
      shell: bash
      run: |
        set -euo pipefail
        build_root=$(mktemp -d "${RUNNER_TEMP:-/tmp}/failurelens-action-build.XXXXXXXX")
        trap 'rm -rf -- "$build_root"' EXIT
        cp -R "${GITHUB_ACTION_PATH}/../../backend" "$build_root/backend"
        python -m pip install --require-hashes -r "$build_root/backend/requirements.lock"
        python -m pip install --no-deps --no-build-isolation "$build_root/backend"
    - name: Ingest, analyze, and report
      id: failurelens
      shell: bash
      env:
        FAILURELENS_ATTEMPT: ${{ inputs.attempt }}
        FAILURELENS_EXPECTED_INPUTS: ${{ inputs.expected-inputs }}
        FAILURELENS_SHARD_COUNT: ${{ inputs.shard-count }}
        FAILURELENS_CONFIG_PATH: ${{ inputs.config-path }}
        FAILURELENS_CONFIG_SHA256: ${{ inputs.config-sha256 }}
        FAILURELENS_ANALYSIS_MODE: ${{ inputs.analysis-mode }}
        FAILURELENS_PUBLICATION_MODE: ${{ inputs.publication-mode }}
        FAILURELENS_DATABASE_URL: ${{ inputs.database-url }}
        FAILURELENS_REPORT: ${{ inputs.report }}
        FAILURELENS_PROJECT: ${{ inputs.project }}
        FAILURELENS_EXTERNAL_ID: ${{ inputs.external-id }}
        FAILURELENS_REPOSITORY: ${{ inputs.repository }}
        FAILURELENS_BASE_SHA: ${{ inputs.base-sha }}
        FAILURELENS_HEAD_SHA: ${{ inputs.head-sha }}
        FAILURELENS_BRANCH: ${{ inputs.branch }}
        FAILURELENS_RUN_SCOPE: ${{ inputs.run-scope }}
        FAILURELENS_COMPARISON_TRUST: ${{ inputs.comparison-trust }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
