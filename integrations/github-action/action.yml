name: FailureLens report
description: Durably ingest supported test output and produce an evidence-grounded deterministic report
branding:
  icon: search
  color: blue
inputs:
  report:
    description: Path to a JUnit XML, Playwright JSON, or FailureLens ZIP bundle
    required: true
  project:
    description: FailureLens project slug
    required: true
  external-id:
    description: Trusted workflow/run identifier
    required: true
  repository:
    description: Trusted repository identity for the analyzed comparison
    required: false
    default: ""
  base-sha:
    description: Trusted base revision for changed-file comparison
    required: false
    default: ""
  head-sha:
    description: Exact tested head revision
    required: false
    default: ""
  branch:
    description: Trusted branch name
    required: false
    default: ""
  run-scope:
    description: Whether this artifact represents a full suite or an impact-selected run
    required: false
    default: unknown
  comparison-trust:
    description: Provenance of changed-file metadata; keep self_reported for untrusted PR artifacts
    required: false
    default: self_reported
  database-url:
    description: SQLAlchemy database URL; PostgreSQL is recommended
    required: false
    default: sqlite+pysqlite:///./failurelens-action.db
outputs:
  report-path:
    description: Sanitized Markdown report path
    value: ${{ steps.failurelens.outputs.report-path }}
  run-id:
    description: Normalized FailureLens run identifier
    value: ${{ steps.failurelens.outputs.run-id }}
  ingestion-id:
    description: Durable FailureLens ingestion identifier
    value: ${{ steps.failurelens.outputs.ingestion-id }}
runs:
  using: composite
  steps:
    - name: Install FailureLens
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}/../../backend"
    - name: Ingest, analyze, and report
      id: failurelens
      shell: bash
      env:
        FAILURELENS_DATABASE_URL: ${{ inputs.database-url }}
        FAILURELENS_REPORT: ${{ inputs.report }}
        FAILURELENS_PROJECT: ${{ inputs.project }}
        FAILURELENS_EXTERNAL_ID: ${{ inputs.external-id }}
        FAILURELENS_REPOSITORY: ${{ inputs.repository }}
        FAILURELENS_BASE_SHA: ${{ inputs.base-sha }}
        FAILURELENS_HEAD_SHA: ${{ inputs.head-sha }}
        FAILURELENS_BRANCH: ${{ inputs.branch }}
        FAILURELENS_RUN_SCOPE: ${{ inputs.run-scope }}
        FAILURELENS_COMPARISON_TRUST: ${{ inputs.comparison-trust }}
      run: "${GITHUB_ACTION_PATH}/run.sh"
